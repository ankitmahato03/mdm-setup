<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AD Users &amp; Groups</title>
  <script src="../base1/cockpit.js"></script>
  <link rel="stylesheet" href="ad.css">
</head>
<body>
  <header>
    <h1>Active Directory <span id="realm"></span></h1>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <div id="status" role="status"></div>

  <nav>
    <button type="button" class="tab active" data-tab="users">Users</button>
    <button type="button" class="tab" data-tab="groups">Groups</button>
    <button type="button" class="tab" data-tab="computers">Computers</button>
  </nav>

  <section id="tab-users">
    <form id="create-user" class="card" autocomplete="off">
      <h2>New user</h2>
      <div class="grid">
        <label>Username<input name="name" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,19}" placeholder="alice"></label>
        <label>First name<input name="first"></label>
        <label>Last name<input name="last"></label>
        <label>Email<input name="mail" type="email"></label>
        <label>Password<input name="pw" type="password" required autocomplete="new-password"></label>
        <label>Access on Ubuntu devices
          <select name="group">
            <option value="linux-users">Login (linux-users)</option>
            <option value="linux-admins">Login + sudo (linux-admins)</option>
            <option value="">None</option>
          </select>
        </label>
      </div>
      <label class="check"><input type="checkbox" name="mustchange" checked> Must change password at first login</label>
      <button type="submit" class="primary">Create user</button>
    </form>
    <input id="user-filter" type="search" placeholder="Filter users">
    <table>
      <thead><tr><th>Username</th><th>Name</th><th>Email</th><th>Groups</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="user-rows"></tbody>
    </table>
  </section>

  <section id="tab-groups" hidden>
    <form id="create-group" class="card" autocomplete="off">
      <h2>New group</h2>
      <div class="grid">
        <label>Group name<input name="name" required pattern="[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}"></label>
        <label>Description<input name="desc"></label>
      </div>
      <button type="submit" class="primary">Create group</button>
    </form>
    <label class="check"><input type="checkbox" id="show-builtin"> Show built-in groups</label>
    <table>
      <thead><tr><th>Group</th><th>Description</th><th>Members</th><th>Actions</th></tr></thead>
      <tbody id="group-rows"></tbody>
    </table>
  </section>

  <section id="tab-computers" hidden>
    <p class="hint">Ubuntu devices joined with 03-join-client.sh appear here. Manage software and updates for them in Landscape.</p>
    <table>
      <thead><tr><th>Name</th><th>DNS name</th><th>OS</th><th>Last logon</th><th>Joined</th><th>Actions</th></tr></thead>
      <tbody id="computer-rows"></tbody>
    </table>
  </section>

  <dialog id="dlg">
    <form id="dlg-form" method="dialog">
      <h2 id="dlg-title"></h2>
      <p id="dlg-msg"></p>
      <div id="dlg-fields"></div>
      <div class="actions">
        <button type="button" id="dlg-cancel">Cancel</button>
        <button type="submit" id="dlg-ok" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <script src="ad.js"></script>
</body>
</html>
